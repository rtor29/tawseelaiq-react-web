server {
    listen 80;
    server_name tawseelaiq.app www.tawseelaiq.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tawseelaiq.app www.tawseelaiq.app;

    ssl_certificate /etc/letsencrypt/live/tawseelaiq.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tawseelaiq.app/privkey.pem;

    root /var/www/tawseelaiq-web/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Static assets — cache 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to backend (Node.js on :3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
