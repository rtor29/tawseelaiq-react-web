# إعداد Nginx للنشر المباشر على VPS (بدون Docker) — يُدمج مع إعدادك القائم على tawseelaiq.app
# ضع ملفات البناء (dist/) في /var/www/tawseela-web ثم فعّل الشهادة بـ certbot

server {
    listen 80;
    server_name tawseelaiq.app www.tawseelaiq.app;

    root /var/www/tawseela-web;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # الواجهة (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # إذا كان خادم Node الخلفي يعمل محلياً على 5050 (PM2) — مرر API والهب
    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location /hubs/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # كاش طويل لأصول البناء
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}

# ثم فعّل HTTPS:
#   sudo certbot --nginx -d tawseelaiq.app -d www.tawseelaiq.app
