# ==============================================================================
# منصة توصيله - إعداد خادم Nginx الرسمي للإنتاج
# الدومين: tawseelaiq.app / www.tawseelaiq.app
# تطبيق الويب (SPA): /var/www/tawseela-web
# خادم الباك إند (Node/Express): 127.0.0.1:5050
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name tawseelaiq.app www.tawseelaiq.app;

    root /var/www/tawseela-web;
    index index.html;

    # شهادات الأمان SSL المعتمدة
    ssl_certificate /etc/ssl/certs/tawseela.crt;
    ssl_certificate_key /etc/ssl/private/tawseela.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 50M;

    # ===== ضغط Gzip لتسريع التصفح وتحسين الأداء =====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/wasm
        image/svg+xml;

    # ===== ترويسات الأمان والموقع الجغرافي (Geolocation API) =====
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ===== لوحة تحكم الإدارة (Admin Dashboard) =====
    location ^~ /dashboard/ {
        proxy_pass http://127.0.0.1:5050/dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /dashboard {
        return 301 /dashboard/;
    }

    # ===== مسار المستمسكات والمرفقات المرفوعة =====
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:5050/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== واجهات الـ REST API =====
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5050/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ===== مسارات الاتصال الفوري Realtime (SignalR / WebSocket) =====
    location ^~ /hubs/ {
        proxy_pass http://127.0.0.1:5050/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ===== كاش طويل المدى للأصول الثابتة (Immutable Cache) =====
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # منع كاش index.html و sw.js لضمان وصول التحديثات للمستخدمين فوراً
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # حظر الوصول للملفات المخفية
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ===== تطبيق الويب أحادي الصفحة (SPA Fallback) =====
    location / {
        try_files $uri $uri/ /index.html;
    }
}
