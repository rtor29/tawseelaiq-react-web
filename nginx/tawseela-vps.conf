# ==============================================================================
# إعداد خادم Nginx لتطبيق توصيله ويب (SPA - Single Page Application)
# الدومين: tawseelaiq.app / www.tawseelaiq.app
# المسار على السيرفر: /var/www/tawseela-web
# ==============================================================================

# 1. خادم HTTP (المنفذ 80): إعادة توجيه إجبارية إلى HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tawseelaiq.app www.tawseelaiq.app;

    # مسار التحقق لشهادات Let's Encrypt (Certbot ACME Challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # إعادة التوجيه التلقائية والدائمة إلى HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. خادم HTTPS المشفّر (المنفذ 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tawseelaiq.app www.tawseelaiq.app;

    root /var/www/tawseela-web;
    index index.html;

    # مسارات شهادة SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/tawseelaiq.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tawseelaiq.app/privkey.pem;

    # بروتوكولات وتشفير آمن
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ===== ضغط الملفات (Gzip Compression) لتسريع التحميل =====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/wasm
        image/svg+xml;

    # ===== ترويسات الأمان والحماية الإجبارية =====
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # HSTS لتأكيد استخدام HTTPS لمدة سنة كاملة
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # السماح بخاصية تحديد الموقع الجغرافي (Geolocation API) عبر النطاق الآمن
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # أقصى حجم لرفع المستمسكات والوثائق
    client_max_body_size 25m;

    # ===== دعم مسارات الصفحة الواحدة (SPA Routing Fallback) =====
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== كاش طويل المدى للأصول الثابتة التي تحمل هاش في أسمائها =====
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # منع كاش index.html و Service Worker لضمان استلام التحديثات فوراً
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # منع الوصول للملفات المخفية
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ===== تمرير طلبات الـ API إلى خادم الباك إند (Node.js/Express على 5050) =====
    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ===== تمرير اتصالات الـ Realtime / WebSocket (SignalR) =====
    location /hubs/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
